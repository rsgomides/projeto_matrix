<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX IMPACT HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff41;
            --red: #ff003c;
            --blue: #00f0ff;
            --bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
        }

        /* Esconde o cursor após alguns segundos parado (modo apresentação) */
        body.idle, body.idle * { cursor: none !important; }

        button:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        /* =========================================
           FUNDO: CHUVA DE CÓDIGO (CANVAS)
           ========================================= */
        #matrix-rain {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.55;
        }

        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.95) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Cortina de vídeo temático */
        .video-curtain {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform: translateY(100%);
            transition: transform 1s cubic-bezier(.65,0,.35,1);
            pointer-events: none;
        }
        .video-curtain.active {
            transform: translateY(0);
            pointer-events: auto;
        }
        .video-curtain video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 2;
            background: rgba(0,0,0,0.6);
            border: 1px solid #888;
            color: #ddd;
            padding: 0.5rem 1.1rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .skip-btn:hover { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(0,255,65,0.3); }

        /* =========================================
           CONTROLES FIXOS (mudo / tela cheia / dicas)
           ========================================= */
        .hud {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 30;
            display: flex;
            gap: 0.5rem;
        }
        .hud button {
            background: rgba(0,0,0,0.7);
            border: 1px solid #555;
            color: #bbb;
            width: 2.6rem;
            height: 2.6rem;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        .hud button:hover { border-color: var(--green); color: var(--green); box-shadow: 0 0 12px rgba(0,255,65,0.3); }

        .kbd-hint {
            position: fixed;
            left: 1rem;
            bottom: 1rem;
            z-index: 15;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #888;
            pointer-events: none;
        }

        /* =========================================
           CONTEÚDO PRINCIPAL
           ========================================= */
        .hub-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .scene {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.8s ease-out;
            padding: 1rem 0;
        }
        .scene.active { display: block; }

        .back-top-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            z-index: 20;
            backdrop-filter: blur(5px);
        }
        .back-top-btn:hover {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 15px var(--green);
        }

        /* Imagens de Impacto */
        .impact-frame {
            position: relative;
            margin: 0 auto 1.5rem;
            max-width: 90%;
            max-height: 45vh;
            border: 1px solid var(--green);
            box-shadow: 0 0 30px rgba(0,255,65,0.15);
            overflow: hidden;
            background: #000;
        }
        .impact-frame img {
            width: 100%;
            height: auto;
            max-height: 45vh;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) contrast(1.2);
            transition: all 0.5s;
        }
        .impact-frame:hover img { filter: grayscale(0%) contrast(1); }

        .impact-frame.full-img {
            max-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .impact-frame.full-img img {
            height: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        /* Personagem recortado (PNG transparente), sem moldura */
        .impact-frame.mentor-cutout {
            border: none;
            background: none;
            box-shadow: none;
            overflow: visible;
            max-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .impact-frame.mentor-cutout img {
            height: 100%;
            max-height: 60vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            background: none;
            filter: drop-shadow(0 0 25px rgba(0,255,65,0.35));
            transition: filter 0.5s;
        }
        .impact-frame.mentor-cutout:hover img {
            filter: drop-shadow(0 0 40px rgba(0,255,65,0.55));
        }

        /* Tipografia */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px var(--green), 0 0 30px rgba(0,255,65,0.5);
            color: #fff;
            padding: 0 1rem;
        }

        #scene-intro h1 {
            font-size: clamp(1.1rem, 2.6vw, 2.2rem);
            margin-bottom: 0.3rem;
        }
        #scene-intro h1:last-of-type { margin-bottom: 1rem; }

        .gate-sub {
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            color: #aaa;
            margin-bottom: 2rem;
            padding: 0 1rem;
            line-height: 1.6;
        }

        .typewriter {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            line-height: 1.6;
            min-height: 2.5em;
            color: #ccc;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0 auto 1.5rem;
            padding: 0 1rem;
            max-width: 90%;
            text-align: center;
        }
        .typewriter .cursor {
            display: inline-block;
            width: .5ch;
            background: var(--green);
            margin-left: 2px;
            animation: blinkCursor 0.7s step-end infinite;
            color: transparent;
        }

        /* =========================================
           PÍLULAS — brilho e preenchimento no hover
           isolation: isolate cria um contexto de empilhamento próprio,
           assim o ::before (z-index: -1) fica ATRÁS do texto mas
           À FRENTE do fundo do botão (antes ele sumia atrás do fundo).
           ========================================= */
        .pills-wrapper {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .pill {
            --c: var(--green);
            --glow: rgba(0,255,65,0.25);
            background: transparent;
            color: var(--c);
            border: 2px solid var(--c);
            padding: 1.2rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            cursor: pointer;
            transition: color 0.3s, box-shadow 0.3s, transform 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            min-width: 180px;
            box-shadow: 0 0 14px var(--glow);
            animation: pillPulse 2.6s ease-in-out infinite;
        }

        .pill::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: var(--c);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: -1;
        }

        .pill:hover,
        .pill:focus-visible {
            color: #000;
            box-shadow: 0 0 40px var(--c);
            transform: scale(1.05);
            animation: none;
        }
        .pill:hover::before,
        .pill:focus-visible::before {
            width: 460px;
            height: 460px;
        }

        .pill-red  { --c: var(--red);   --glow: rgba(255,0,60,0.3); }
        .pill-blue { --c: var(--blue);  --glow: rgba(0,240,255,0.3); }
        .pill-start { --c: var(--green); --glow: rgba(0,255,65,0.3); }

        @keyframes pillPulse {
            0%, 100% { box-shadow: 0 0 10px var(--glow); }
            50%      { box-shadow: 0 0 26px var(--glow); }
        }

        /* =========================================
           TELA DE REVELAÇÃO (sobe por cima, com transição)
           Cada clique numa pílula abre esta tela com o próximo texto
           da sequência. O botão "Voltar" desce a tela de novo.
           ========================================= */
        .pill-screen {
            --c: var(--blue);
            --glow: rgba(0,240,255,0.35);
            position: fixed;
            inset: 0;
            z-index: 25;
            display: flex;
            overflow-y: auto;
            padding: 4.5rem 1rem;
            background: radial-gradient(circle at center, rgba(5,5,5,0.97) 0%, rgba(5,5,5,0.995) 100%);
            border-top: 2px solid var(--c);
            box-shadow: 0 -8px 40px var(--glow);
            transform: translateY(100%);
            visibility: hidden;
            transition: transform 0.8s cubic-bezier(.65,0,.35,1), visibility 0s linear 0.8s;
        }
        .pill-screen.open {
            transform: translateY(0);
            visibility: visible;
            transition: transform 0.8s cubic-bezier(.65,0,.35,1), visibility 0s;
        }
        .pill-screen.illusion { --c: var(--blue); --glow: rgba(0,240,255,0.35); }
        .pill-screen.reality  { --c: var(--red);  --glow: rgba(255,0,60,0.35); }

        .ps-card {
            margin: auto;
            width: 100%;
            max-width: 820px;
            text-align: center;
            padding: 2rem 1.5rem;
            border: 1px solid var(--c);
            background: #000;
            box-shadow: 0 0 40px var(--glow);
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .pill-screen.open .ps-card {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease 0.45s, transform 0.6s ease 0.45s;
        }

        .ps-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--c);
            text-shadow: 0 0 14px var(--c);
        }
        .ps-counter {
            margin: 0.4rem 0 1.5rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #aaa;
        }
        .ps-content {
            font-size: clamp(1rem, 2vw, 1.4rem);
            line-height: 1.8;
            color: #ddd;
            text-align: left;
        }
        .ps-content p { margin-bottom: 1rem; }
        .ps-content .src { font-size: 0.8em; color: #999; }
        .ps-hint {
            margin-top: 1rem;
            color: #aaa;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }
        .ps-card .ps-back { border-color: var(--c); color: var(--c); }
        .ps-card .ps-back:hover { background: var(--c); color: #000; box-shadow: 0 0 20px var(--glow); }

        body.no-scroll { overflow: hidden; }

        /* Aparece só depois que as duas pílulas foram escolhidas */
        .conclude-btn {
            display: none;
            margin: 1.5rem auto 0;
        }
        .conclude-btn.show { display: inline-block; }

        .back-btn {
            margin-top: 1.5rem;
            background: transparent;
            border: 1px solid #777;
            color: #aaa;
            padding: 0.8rem 2rem;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-btn:hover { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(0,255,65,0.2); }

        .final-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        /* Animações */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blinkCursor { 50% { opacity: 0; } }

        .glitch-transition { animation: glitchAnim 0.4s cubic-bezier(.25, .46, .45, .94) both; }
        @keyframes glitchAnim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(-5px, -5px); filter: hue-rotate(180deg); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(270deg); }
            80% { transform: translate(5px, -5px); filter: hue-rotate(360deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        .pill-screen::-webkit-scrollbar { width: 6px; }
        .pill-screen::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        .pill-screen::-webkit-scrollbar-thumb { background: var(--green); border-radius: 3px; }

        /* =========================================
           RESPONSIVIDADE
           ========================================= */
        @media (max-width: 768px) {
            .hub-container { padding: 1rem 0.5rem; }
            .pills-wrapper { flex-direction: column; gap: 1rem; align-items: center; }
            .pill { width: 100%; max-width: 300px; }
            .impact-frame { max-width: 95%; max-height: 35vh; }
            .impact-frame img { max-height: 35vh; }
            .typewriter { font-size: clamp(0.85rem, 2.5vw, 1.2rem); }
            .back-top-btn { top: 0.5rem; left: 0.5rem; padding: 0.5rem 0.8rem; font-size: 0.8rem; }
            .ps-card { padding: 1.4rem 1rem; }
            .kbd-hint { display: none; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; letter-spacing: 2px; }
            .ps-title { font-size: 1.3rem; letter-spacing: 2px; }
            .pill { padding: 1rem 1.5rem; font-size: 0.9rem; }
            .typewriter { font-size: 0.9rem; }
        }

        @media (min-height: 1000px) {
            .impact-frame { max-height: 50vh; }
            .impact-frame img { max-height: 50vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- Fundo: chuva de código (canvas) -->
    <canvas id="matrix-rain" aria-hidden="true"></canvas>
    <div class="video-overlay"></div>

    <!-- CORTINA DE VÍDEO TEMÁTICO
         EDIT: coloque o arquivo "theme-video.mp4" na mesma pasta deste HTML. -->
    <div id="theme-video-curtain" class="video-curtain">
        <video id="theme-video" playsinline preload="metadata">
            <source src="theme-video.mp4" type="video/mp4">
        </video>
        <button class="skip-btn" id="skip-btn" onclick="skipThemeVideo()">Pular ▶</button>
    </div>

    <!-- MÚSICA DE FUNDO
         EDIT: coloque o arquivo "intro-music.mp3" na mesma pasta deste HTML.
         Volumes ajustáveis em CONFIG (musicVolume / musicVolumeUnderVideo). -->
    <audio id="intro-music" loop preload="auto">
        <source src="intro-music.mp3" type="audio/mpeg">
    </audio>

    <!-- MÚSICA DE FUNDO DA SEGUNDA TELA (escolha das pílulas)
         EDIT: coloque o arquivo "choice-music.mp3" na mesma pasta deste HTML.
         Volume ajustável em CONFIG (choiceMusicVolume). -->
    <audio id="choice-music" loop preload="auto">
        <source src="choice-music.mp3" type="audio/mpeg">
    </audio>

    <!-- CONTROLES FIXOS -->
    <div class="hud">
        <button id="btn-mute" onclick="toggleMute()" aria-label="Ativar ou desativar o som" aria-pressed="false" title="Som (M)">🔊</button>
        <button id="btn-fs" onclick="toggleFullscreen()" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
    </div>
    <div class="kbd-hint">← → NAVEGAR · 1 / 2 PÍLULAS · F TELA CHEIA · M SOM · ESC REINICIAR</div>

    <!-- TELA DE REVELAÇÃO: sobe por cima ao clicar numa pílula -->
    <div id="pill-screen" class="pill-screen illusion" role="dialog" aria-modal="true" aria-labelledby="ps-title" aria-hidden="true">
        <div class="ps-card">
            <div class="ps-title" id="ps-title"></div>
            <div class="ps-counter" id="ps-counter"></div>
            <div class="ps-content" id="ps-content" aria-live="polite"></div>
            <div class="ps-hint" id="ps-hint"></div>
            <button id="ps-back" class="back-btn ps-back" onclick="closePillScreen()">← VOLTAR ÀS PÍLULAS</button>
        </div>
    </div>

    <!-- =========================================
         CONTEÚDO DA APRESENTAÇÃO
         ========================================= -->
    <div class="hub-container">

        <!-- CENA 0: START GATE (o clique libera áudio e vídeo) -->
        <div id="scene-gate" class="scene active">
            <h1>MATRIX IMPACT HUB</h1>
            <p class="gate-sub">Ligue o som e, se quiser, use a tela cheia (tecla F).</p>
            <button id="gate-btn" class="pill pill-start" autofocus onclick="startExperience()">ENTRAR NA MATRIX</button>
        </div>

        <!-- CENA 1: INTRODUÇÃO -->
        <div id="scene-intro" class="scene">
            <div class="impact-frame mentor-cutout">
                <img id="img-intro" alt="O Mentor">
            </div>
            <h1>BEM-VINDO</h1>
            <h1>AO PARADOXO DA REALIDADE</h1>
            <div class="typewriter" id="intro-text"></div>
            <button class="pill pill-start" onclick="goToScene('scene-choice')">CLIQUE E DESCUBRA!</button>
        </div>

        <!-- CENA 2: ESCOLHA -->
        <div id="scene-choice" class="scene">
            <button class="back-top-btn" onclick="goToScene('scene-intro')">← VOLTAR</button>

            <div class="impact-frame mentor-cutout" id="choice-frame">
                <img id="img-choice" alt="O Mentor segurando as pílulas azul e vermelha">
            </div>
            <h1>A ESCOLHA É SUA</h1>
            <div class="typewriter" id="choice-text"></div>

            <div class="pills-wrapper">
                <button class="pill pill-blue" onclick="reveal('illusion')" aria-label="Pílula azul: a ilusão confortável">
                    PÍLULA AZUL<br><small style="font-size:0.7em;opacity:0.8;display:block;margin-top:5px;">A ILUSÃO CONFORTÁVEL</small>
                </button>
                <button class="pill pill-red" onclick="reveal('reality')" aria-label="Pílula vermelha: a realidade crua">
                    PÍLULA VERMELHA<br><small style="font-size:0.7em;opacity:0.8;display:block;margin-top:5px;">A REALIDADE CRUA</small>
                </button>
            </div>

            <!-- Aparece depois de escolher as duas pílulas -->
            <button id="conclude-btn" class="pill pill-start conclude-btn" onclick="goToScene('scene-final')">CONCLUIR →</button>

            <button class="back-btn" onclick="resetHub()">↺ RESETAR SIMULAÇÃO</button>
        </div>

        <!-- CENA 3: FECHAMENTO -->
        <div id="scene-final" class="scene">
            <h1>E AGORA?</h1>
            <div class="typewriter" id="final-text"></div>
            <div class="final-actions">
                <button class="back-btn" onclick="goToScene('scene-choice')">← REVER AS PÍLULAS</button>
                <button class="back-btn" onclick="resetHub()">↺ RECOMEÇAR</button>
            </div>
        </div>

    </div>

<script>
// ==========================================
// CONFIGURAÇÃO
// ==========================================
const CONFIG = {
    introText: "Você está aqui porque sabe algo. Você sente que há algo errado... Hoje, vamos explorar duas perspectivas...",
    choiceText: "Pílula Azul: acorde e acredite no que quiser. Pílula Vermelha: veja quão fundo vai a toca do coelho.",
    // EDIT: textos da cena final
    finalTextBoth: "Você viu os dois lados. A ilusão conforta; a realidade informa. O que você vai fazer com isso agora?",
    finalTextPartial: "Você viu apenas um lado da história. Volte e escolha a outra pílula antes de decidir.",
    typingSpeed: 40,

    // ÁUDIO
    musicEnabled: true,
    musicVolume: 0.15,           // volume da música da abertura (0 a 1)
    choiceMusicVolume: 0.15,     // volume da música da 2ª tela (escolha das pílulas)
    musicVolumeUnderVideo: 0.04, // volume da música DURANTE o vídeo (fica bem baixinho)
    videoVolume: 1.0,            // volume do áudio do vídeo temático
    musicFadeMs: 1200,           // duração da transição de volume

    idleCursorMs: 3000           // esconde o cursor após esse tempo parado
};

// ==========================================
// CONTEÚDO — TEXTOS DAS PÍLULAS (até 10 cada)
// A cada clique na mesma pílula, abre uma tela com o próximo
// texto da lista. Ao chegar no último, volta ao primeiro (loop).
// Para editar, é só mexer nos arrays abaixo. Textos vazios (só
// com o comentário <!-- EDIT -->) são ignorados, então o contador
// mostra apenas o que já está preenchido.
// Para citar uma fonte, use <p class="src">Fonte: ...</p> no texto.
// ==========================================
const illusionTexts = [
    `<p>📊 "O mercado sempre sobe no longo prazo."</p>
     <p>"Basta trabalhar duro que o sucesso vem."</p>
     <p>⚠️ <em>(Dados superficiais, mitos populares, narrativas confortáveis)</em></p>`,

    `<p><!-- EDIT: texto 2 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 3 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 4 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 5 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 6 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 7 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 8 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 9 da pílula azul --></p>`,
    `<p><!-- EDIT: texto 10 da pílula azul --></p>`
];

const realityTexts = [
    `<p>📉 "70% dos traders perdem dinheiro nos primeiros 2 anos."</p>
     <p>🔍 "Sucesso = Estratégia + Timing + Resiliência, não apenas esforço."</p>
     <p>✅ <em>(Dados reais, verdades inconvenientes, insights acionáveis)</em></p>`,

    `<p><!-- EDIT: texto 2 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 3 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 4 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 5 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 6 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 7 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 8 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 9 da pílula vermelha --></p>`,
    `<p><!-- EDIT: texto 10 da pílula vermelha --></p>`
];

// Ignora textos vazios (só tags/comentários) para nunca abrir uma tela em branco
const hasContent = (html) => html.replace(/<!--[\s\S]*?-->|<[^>]*>|&nbsp;|\s/g, '').length > 0;
const TEXTS = {
    illusion: illusionTexts.filter(hasContent),
    reality: realityTexts.filter(hasContent)
};

// ==========================================
// ESTADO
// ==========================================
let currentScene = 'scene-gate';
let started = false;
let curtainActive = false;
let screenOpen = false;
let screenType = null;
let visited = { illusion: false, reality: false };
const state = { muted: false };

const introMusic = document.getElementById('intro-music');
const themeVideo = document.getElementById('theme-video');
introMusic.volume = 0;

// ==========================================
// CARREGADOR ROBUSTO DE IMAGENS
// ==========================================
function loadImageWithFallback(imgId, baseName, extensions = ['jpg','jpeg','png','webp']) {
    const img = document.getElementById(imgId);
    if (!img) return;
    let i = 0;
    img.onerror = function () {
        i++;
        if (i < extensions.length) {
            img.src = `${baseName}.${extensions[i]}`;
        } else {
            const frame = img.closest('.impact-frame');
            if (frame) {
                frame.innerHTML = `<div style="padding:2rem;color:#ff003c;font-size:0.9rem;line-height:1.6;">
                    ⚠️ IMAGEM NÃO ENCONTRADA<br>
                    <span style="color:#888;">Esperado: ${baseName}.(jpg/png/webp) na mesma pasta do HTML</span>
                </div>`;
                frame.style.border = '1px dashed #ff003c';
                frame.style.background = 'rgba(255,0,60,0.05)';
            }
        }
    };
    img.src = `${baseName}.${extensions[0]}`;
}

// ==========================================
// CHUVA DE CÓDIGO (CANVAS)
// ==========================================
const rain = (() => {
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');
    const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789'.split('');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 0, h = 0, fontSize = 16, cols = 0, drops = [], last = 0, raf = null, resizeTimer;

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fontSize = w < 600 ? 14 : 16;
        cols = Math.ceil(w / fontSize);
        drops = Array.from({ length: cols }, () => Math.floor(Math.random() * (h / fontSize)));
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, w, h);
    }

    function draw() {
        ctx.fillStyle = 'rgba(5,5,5,0.09)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = fontSize + 'px "Share Tech Mono", monospace';
        for (let i = 0; i < cols; i++) {
            const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            ctx.fillStyle = Math.random() < 0.05 ? '#d8ffe0' : '#00ff41';
            ctx.fillText(ch, x, y);
            if (y > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    function frame(t) {
        raf = requestAnimationFrame(frame);
        if (t - last < 45) return; // ~22 quadros por segundo
        last = t;
        draw();
    }

    function start() {
        resize();
        if (reduceMotion) {
            // Sem animação: desenha alguns quadros e para
            for (let i = 0; i < 60; i++) draw();
            return;
        }
        if (!raf) raf = requestAnimationFrame(frame);
    }

    function stop() {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
    }

    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            resize();
            if (reduceMotion) for (let i = 0; i < 60; i++) draw();
        }, 150);
    });

    document.addEventListener('visibilitychange', () => {
        if (reduceMotion) return;
        if (document.hidden) stop(); else if (!raf) raf = requestAnimationFrame(frame);
    });

    return { start, stop };
})();

// ==========================================
// ÁUDIO: música de fundo com volume controlado
// A música toca baixinho por baixo do áudio do vídeo e sobe
// suavemente quando o vídeo termina.
// ==========================================
const choiceMusic = document.getElementById('choice-music');
choiceMusic.volume = 0;

// Transição de volume de qualquer faixa; ao chegar em 0 a faixa é pausada
function fadeAudio(el, target, ms = CONFIG.musicFadeMs) {
    clearInterval(el._fade);
    const from = el.volume;
    const t0 = performance.now();
    el._fade = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        el.volume = Math.max(0, Math.min(1, from + (target - from) * k));
        if (k >= 1) {
            clearInterval(el._fade);
            if (target === 0) el.pause();
        }
    }, 50);
}

// Liga a faixa (se estiver parada) e leva o volume até o alvo
function playTrack(el, target) {
    if (!CONFIG.musicEnabled) return;
    if (el.paused) {
        el.volume = 0;
        el.play().catch(() => {});
    }
    fadeAudio(el, target);
}

const fadeMusicTo = (target, ms) => fadeAudio(introMusic, target, ms);
const startMusic = (target) => playTrack(introMusic, target);

function toggleMute() {
    state.muted = !state.muted;
    introMusic.muted = state.muted;
    choiceMusic.muted = state.muted;
    themeVideo.muted = state.muted;
    const btn = document.getElementById('btn-mute');
    btn.textContent = state.muted ? '🔇' : '🔊';
    btn.setAttribute('aria-pressed', String(state.muted));
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
    } else if (document.exitFullscreen) {
        document.exitFullscreen();
    }
}

// ==========================================
// CORTINA DE VÍDEO TEMÁTICO
// ==========================================
let skipThemeVideo = () => {};

function playThemeVideoCurtain(onDone) {
    const curtain = document.getElementById('theme-video-curtain');
    const source = themeVideo.querySelector('source');
    let finished = false;
    let safety = null;

    function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(safety);
        themeVideo.pause();
        curtainActive = false;
        curtain.classList.remove('active');
        if (!introMusic.paused) fadeMusicTo(CONFIG.musicVolume);
        setTimeout(onDone, 1000); // espera a cortina descer
    }

    skipThemeVideo = finish;
    curtainActive = true;

    // Arquivo ausente: o erro do <source> já aconteceu antes do clique e não
    // dispara de novo, então checa o estado do vídeo e pula a cortina na hora
    if (themeVideo.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
        finish();
        return;
    }

    themeVideo.currentTime = 0;
    themeVideo.volume = CONFIG.videoVolume;
    themeVideo.muted = state.muted;
    themeVideo.onended = finish;
    themeVideo.onerror = finish;
    if (source) source.addEventListener('error', finish, { once: true });

    // Se o vídeo travar carregando, não deixa a tela presa
    safety = setTimeout(finish, 8000);
    themeVideo.addEventListener('playing', () => clearTimeout(safety), { once: true });

    requestAnimationFrame(() => curtain.classList.add('active'));

    themeVideo.play().catch(() => {
        // Som bloqueado: tenta mudo e libera no próximo clique
        themeVideo.muted = true;
        themeVideo.play().catch(finish);
        document.addEventListener('click', function unmute() {
            if (!state.muted) themeVideo.muted = false;
        }, { once: true });
    });
}

// ==========================================
// EFEITO DE DIGITAÇÃO (cancela digitações anteriores)
// ==========================================
function typeWriter(elementId, text, speed = CONFIG.typingSpeed) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const token = el._tw = (el._tw || 0) + 1;
    el.textContent = '';
    let i = 0;
    (function step() {
        if (el._tw !== token) return; // outra digitação assumiu
        if (i < text.length) {
            el.textContent = text.slice(0, ++i);
            setTimeout(step, speed);
        } else {
            el.innerHTML = '';
            el.appendChild(document.createTextNode(text));
            const c = document.createElement('span');
            c.className = 'cursor';
            c.textContent = '|';
            el.appendChild(c);
        }
    })();
}

// ==========================================
// NAVEGAÇÃO DE CENAS
// ==========================================
function showScene(sceneId) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(sceneId);
    if (target) {
        target.classList.add('active');
        currentScene = sceneId;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function goToScene(sceneId) {
    showScene(sceneId);

    if (sceneId === 'scene-intro') {
        setTimeout(() => typeWriter('intro-text', CONFIG.introText), 500);
        startMusic(CONFIG.musicVolume);
        fadeAudio(choiceMusic, 0);
    } else if (sceneId === 'scene-choice') {
        setTimeout(() => typeWriter('choice-text', CONFIG.choiceText), 500);
        fadeMusicTo(0);
        playTrack(choiceMusic, CONFIG.choiceMusicVolume);
    } else if (sceneId === 'scene-final') {
        const both = visited.illusion && visited.reality;
        setTimeout(() => typeWriter('final-text', both ? CONFIG.finalTextBoth : CONFIG.finalTextPartial), 500);
        fadeMusicTo(0);
        fadeAudio(choiceMusic, 0);
    }
}

function startExperience() {
    if (started) return;
    started = true;
    showScene('scene-intro'); // fica por baixo da cortina
    startMusic(CONFIG.musicVolumeUnderVideo);
    playThemeVideoCurtain(() => {
        setTimeout(() => typeWriter('intro-text', CONFIG.introText), 300);
    });
}

// ==========================================
// TELA DE REVELAÇÃO (sobe por cima com transição)
// Clicou na pílula → glitch → a tela sobe com o próximo texto da
// sequência. "Voltar" desce a tela e devolve às pílulas, onde um
// novo clique mostra o texto seguinte (1 → 2 → ... → 10 → 1).
// ==========================================
const SCREEN_META = {
    illusion: { title: '💊 A ILUSÃO',    pill: '.pill-blue', name: 'azul' },
    reality:  { title: '💊 A REALIDADE', pill: '.pill-red',  name: 'vermelha' }
};
const seqIndex = { illusion: 0, reality: 0 };
let openTimer = null;

function glitch() {
    const hub = document.querySelector('.hub-container');
    hub.classList.add('glitch-transition');
    setTimeout(() => hub.classList.remove('glitch-transition'), 400);
}

function renderScreen(type) {
    const list = TEXTS[type];
    const total = list.length;
    const i = seqIndex[type] % total;
    const screen = document.getElementById('pill-screen');

    screen.classList.remove('illusion', 'reality');
    screen.classList.add(type);
    document.getElementById('ps-title').textContent = SCREEN_META[type].title;
    document.getElementById('ps-counter').textContent = `${i + 1} / ${total}`;
    document.getElementById('ps-content').innerHTML = list[i];

    const name = SCREEN_META[type].name;
    let hint = '';
    if (total > 1) {
        hint = (i === total - 1)
            ? `Fim da sequência. Clique na pílula ${name} para recomeçar.`
            : `Volte e clique de novo na pílula ${name} para ver o próximo.`;
    }
    document.getElementById('ps-hint').textContent = hint;

    seqIndex[type] = (i + 1) % total;
    screen.scrollTop = 0;
}

function reveal(type) {
    if (screenOpen || !TEXTS[type].length) return;
    screenOpen = true;
    screenType = type;
    glitch();
    openTimer = setTimeout(() => openPillScreen(type), 250);
}

function openPillScreen(type) {
    renderScreen(type);
    visited[type] = true;
    updateConcludeButton();

    const screen = document.getElementById('pill-screen');
    screen.classList.add('open');
    screen.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    document.querySelector('.hub-container').inert = true;
    document.getElementById('ps-back').focus({ preventScroll: true });
}

function closePillScreen() {
    if (!screenOpen) return;
    clearTimeout(openTimer);
    screenOpen = false;

    const screen = document.getElementById('pill-screen');
    screen.classList.remove('open');
    screen.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    document.querySelector('.hub-container').inert = false;

    // Devolve o foco para a pílula que abriu a tela
    const pill = screenType && document.querySelector(SCREEN_META[screenType].pill);
    if (pill) pill.focus({ preventScroll: true });
    screenType = null;
}

function updateConcludeButton() {
    document.getElementById('conclude-btn')
        .classList.toggle('show', visited.illusion && visited.reality);
}

function resetHub() {
    closePillScreen();
    seqIndex.illusion = 0;
    seqIndex.reality = 0;
    visited = { illusion: false, reality: false };
    updateConcludeButton();
    goToScene('scene-intro');
}

// ==========================================
// NAVEGAÇÃO POR TECLADO
// ==========================================
function next() {
    if (curtainActive || screenOpen) return;
    switch (currentScene) {
        case 'scene-gate': startExperience(); break;
        case 'scene-intro': goToScene('scene-choice'); break;
        case 'scene-choice':
            if (!visited.illusion && TEXTS.illusion.length) reveal('illusion');
            else if (!visited.reality && TEXTS.reality.length) reveal('reality');
            else goToScene('scene-final');
            break;
    }
}

function prev() {
    if (curtainActive) return;
    if (screenOpen) { closePillScreen(); return; }
    if (currentScene === 'scene-choice') goToScene('scene-intro');
    else if (currentScene === 'scene-final') goToScene('scene-choice');
}

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onButton = e.target && e.target.closest && e.target.closest('button');
    switch (e.key) {
        case 'ArrowRight':
            e.preventDefault(); next(); break;
        case ' ':
            if (!onButton) { e.preventDefault(); next(); }
            break;
        case 'ArrowLeft':
            e.preventDefault(); prev(); break;
        case 'f': case 'F':
            toggleFullscreen(); break;
        case 'm': case 'M':
            toggleMute(); break;
        case '1':
            if (currentScene === 'scene-choice') reveal('illusion'); break;
        case '2':
            if (currentScene === 'scene-choice') reveal('reality'); break;
        case 'Escape':
            if (curtainActive) skipThemeVideo();
            else if (screenOpen) closePillScreen();
            else if (currentScene !== 'scene-gate') resetHub();
            break;
    }
});

// ==========================================
// CURSOR OCULTO APÓS INATIVIDADE
// ==========================================
let idleTimer;
function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), CONFIG.idleCursorMs);
}
['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));

// ==========================================
// INICIALIZAÇÃO
// ==========================================
window.addEventListener('DOMContentLoaded', () => {
    loadImageWithFallback('img-intro', 'morpheus-dialogue');
    loadImageWithFallback('img-choice', 'morpheus-pills');
    rain.start();
    wake();
    const gateBtn = document.getElementById('gate-btn');
    if (gateBtn) gateBtn.focus();
});
</script>
